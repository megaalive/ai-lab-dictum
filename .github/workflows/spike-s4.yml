name: Spike S4 numerics
on:
  push:
    paths: ['tests/spikes/s4/**', '.github/workflows/spike-s4.yml']
  pull_request:
    paths: ['tests/spikes/s4/**', '.github/workflows/spike-s4.yml']
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-24.04
    container: debian:13.5-slim@sha256:a617c1cdde36a7e0194b2f07dff669e1753c03c3205356b94f9f350b0f9a57d1
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - run: apt-get -o APT::Update::Error-Mode=any update && apt-get install -y --no-install-recommends "$CC" libc6-dev python3 git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          set -eu
          sha=$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)
          echo "SHA checkout $sha"
          test "$sha" = "$GITHUB_SHA"
          cat /etc/debian_version
          uname -smr
          python3 --version
          "$CC" --version
          mkdir -p /tmp/dictum-s4
          "$CC" -std=c17 -O2 -Wall -Wextra -Werror -Wpedantic -Wconversion -fno-fast-math -ffp-contract=off tests/spikes/s4/numerics.c -lm -o /tmp/dictum-s4/numerics
          python3 -B tests/spikes/s4/run.py /tmp/dictum-s4/numerics
