name: Kontrak security A5
on:
  push:
    paths: ['docs/security/**', 'docs/adr/0002-broker-approval.md', 'spec/security/**', 'tests/security/**', '.github/workflows/security-contract.yml']
  pull_request:
    paths: ['docs/security/**', 'docs/adr/0002-broker-approval.md', 'spec/security/**', 'tests/security/**', '.github/workflows/security-contract.yml']
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    container: debian:13.5-slim@sha256:a617c1cdde36a7e0194b2f07dff669e1753c03c3205356b94f9f350b0f9a57d1
    timeout-minutes: 5
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends python3 git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          sha=$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)
          echo "SHA checkout $sha"
          test "$sha" = "$GITHUB_SHA"
          cat /etc/debian_version
          uname -smr
          python3 --version
          python3 -B tests/security/run.py
