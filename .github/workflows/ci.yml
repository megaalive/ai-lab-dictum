name: CI native

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.compiler }} / ${{ matrix.config.type }}
    runs-on: ubuntu-24.04
    # Manifest linux/amd64 resmi untuk Debian 13.5 slim.
    container: debian:13.5-slim@sha256:a617c1cdde36a7e0194b2f07dff669e1753c03c3205356b94f9f350b0f9a57d1
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        config:
          - type: Release
            sanitizers: "OFF"
          - type: Debug
            sanitizers: "ON"
    env:
      CC: ${{ matrix.compiler }}
      BUILD_TYPE: ${{ matrix.config.type }}
      SANITIZERS: ${{ matrix.config.sanitizers }}

    steps:
      - name: Pasang toolchain Debian
        run: |
          apt-get -o APT::Update::Error-Mode=any update
          packages=(ca-certificates git cmake make libc6-dev libssl-dev python3-jsonschema "$CC")
          if [[ "$CC" == clang && "$SANITIZERS" == ON ]]; then
            packages+=(libclang-rt-dev)
          fi
          apt-get install -y --no-install-recommends "${packages[@]}"

      - name: Ambil sumber
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verifikasi lingkungan dan konfigurasi
        run: |
          . /etc/os-release
          test "$ID" = debian
          test "$VERSION_ID" = 13
          test "$(uname -m)" = x86_64
          cat /etc/os-release /etc/debian_version
          uname -smr
          # Checkout memakai HOME sementara, sedangkan workspace milik runner host.
          checked_sha=$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)
          printf 'SHA checkout %s\n' "$checked_sha"
          test "$checked_sha" = "$GITHUB_SHA"
          "$CC" --version
          cmake --version
          dpkg-query -W libssl-dev libssl3t64
          cmake -S . -B build/ci \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DDICTUM_ENABLE_ASAN="$SANITIZERS" \
            -DDICTUM_ENABLE_UBSAN="$SANITIZERS"

      - name: Kompilasi
        run: cmake --build build/ci --parallel 2 --verbose

      - name: Audit link artefak
        run: |
          ldd build/ci/dictum
          ldd build/ci/tests/ir_probe
          grep -m 1 '^License:' /usr/share/doc/libssl-dev/copyright

      - name: Uji CLI dan native IR
        run: ctest --test-dir build/ci --verbose --output-on-failure --no-tests=error

      - name: Fuzz parser langsung
        if: matrix.compiler == 'clang' && matrix.config.sanitizers == 'ON'
        run: |
          python3 -B tests/ir/fuzz_corpus.py build/ci/fuzz-corpus
          clang -std=c17 -O1 -g -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Wformat=2 \
            -Wstrict-prototypes -Wmissing-prototypes -Wundef -Wvla -Werror \
            -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=undefined \
            -Iruntime/native -Ibuild/ci runtime/native/ir_wire.c runtime/native/ir_schema.c runtime/native/ir_digest.c \
            tests/ir/fuzz.c -lcrypto -o build/ci/ir-fuzz
          build/ci/ir-fuzz -seed=23004 -runs=25000 -max_len=32769 -timeout=5 \
            -artifact_prefix=build/ci/ build/ci/fuzz-corpus

  ir-contract:
    name: Kontrak IR Draft 2020-12
    runs-on: ubuntu-24.04
    container: debian:13.5-slim@sha256:a617c1cdde36a7e0194b2f07dff669e1753c03c3205356b94f9f350b0f9a57d1
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Pasang oracle pengembangan
        run: |
          apt-get -o APT::Update::Error-Mode=any update
          apt-get install -y --no-install-recommends ca-certificates git python3-jsonschema

      - name: Ambil sumber
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Uji kontrak dan fixture
        run: |
          checked_sha=$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)
          printf 'SHA checkout %s\n' "$checked_sha"
          test "$checked_sha" = "$GITHUB_SHA"
          cat /etc/debian_version
          uname -smr
          python3 --version
          dpkg-query -W python3-jsonschema python3-referencing python3-jsonschema-specifications python3-attr python3-rpds-py
          python3 -B tests/ir/run.py

      - name: Uji registry dan profil katalog A3
        run: python3 -B tests/catalog/run.py

      - name: Uji domain kandidat F1 (data-only)
        run: python3 -B tests/catalog/f1_domains.py
